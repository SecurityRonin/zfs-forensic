name: semver

# SemVer tripwire against the PUBLISHED crate. The failure this closes is real: a
# change that added a variant to a public non-`#[non_exhaustive]` enum and a field
# to a public struct landed as `fix(...)`, which release-plz maps to a PATCH bump —
# a breaking change shipped as a patch release, caught only in human review.
# cargo-semver-checks classifies the change against what is on crates.io and fails
# unless the manifest version bump is adequate. On a 0.x line a breaking change
# needs a MINOR bump (0.1 -> 0.2), which the tool understands.
#
# Complements `public-api` (which flags ANY surface change, additive included);
# this job is the one that says *breaking*.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semver:
    name: SemVer (vs crates.io)
    runs-on: ubuntu-latest
    env:
      # Pin the tool: its lint set and rustdoc-JSON support decide the verdicts,
      # so an unpinned upgrade could silently change what this gate accepts.
      CARGO_SEMVER_CHECKS_VERSION: "0.49.0"
      # Every PUBLISHED library crate in the workspace. `fuzz/` is a separate
      # workspace and is `publish = false`, so it has no baseline and no place here.
      CRATES: "zfs-forensic-core zfs-forensic"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.8
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: Check each published crate against its crates.io baseline
        run: |
          # Sparse-index path layout (crates.io registry spec): 1-, 2- and
          # 3-character names live under 1/, 2/ and 3/<first-char>/; everything
          # else under <chars 1-2>/<chars 3-4>/.
          # https://doc.rust-lang.org/cargo/reference/registry-index.html
          index_path() {
            name=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            case ${#name} in
              1) printf '1/%s' "$name" ;;
              2) printf '2/%s' "$name" ;;
              3) printf '3/%s/%s' "${name:0:1}" "$name" ;;
              *) printf '%s/%s/%s' "${name:0:2}" "${name:2:2}" "$name" ;;
            esac
          }

          fail=0
          for crate in $CRATES; do
            echo "::group::$crate"
            url="https://index.crates.io/$(index_path "$crate")"
            if curl -sfSL -o /dev/null "$url"; then
              cargo semver-checks --package "$crate" --all-features || fail=1
            else
              # Never silently pass: an unpublished crate has NO baseline to
              # compare against, so say so by name.
              echo "SKIPPED $crate: not found in the crates.io sparse index ($url) — no published baseline exists yet, so cargo-semver-checks cannot classify a change. This crate becomes gated automatically on its first publish."
              echo "::warning title=semver baseline missing::$crate is not on crates.io yet — skipped (no baseline)."
            fi
            echo "::endgroup::"
          done
          exit $fail
